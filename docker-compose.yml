name: ecommerce-api

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ecommerce_api:local
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      RAILS_FORCE_SSL: "false"
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "80:80"
    volumes:
      - storage:/rails/storage
      - ./config/master.key:/rails/config/master.key:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost/up"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ecommerce_api_production
      POSTGRES_USER: ecommerce_api
      POSTGRES_PASSWORD: ${ECOMMERCE_API_DATABASE_PASSWORD:?Define ECOMMERCE_API_DATABASE_PASSWORD in .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce_api -d ecommerce_api_production"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  storage:
